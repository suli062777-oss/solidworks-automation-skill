[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-automation"
version = "1.3.0"
description = "Enterprise-oriented SolidWorks automation skill, MCP server, and CAD domain layer"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wzyn20051216" }]
dependencies = [
  "pywin32>=305; platform_system == 'Windows'",
  "comtypes>=1.2.0; platform_system == 'Windows'",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "mcp>=1.2.0"]

[project.scripts]
solidworks-mcp-server = "solidworks_automation.sw_mcp_server:main"
solidworks-thin-slice = "solidworks_automation.sw_benchmark:main"

[tool.setuptools]
package-dir = { "solidworks_automation" = "scripts" }
packages = ["solidworks_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
